name: iOS qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator qualification (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Full plan on the primary simulator runs as three parallel
          # legs: the unit tests, and the UI tests dealt by name into two
          # shards so a new UI test lands in one without being listed.
          - label: primary-unit
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppTests
          - label: primary-ui-1
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppUITests
            shard: 1/2
          - label: primary-ui-2
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppUITests
            shard: 2/2
          - label: ios18-unit
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
            runtime_prefix: com.apple.CoreSimulator.SimRuntime.iOS-18-
            content_size: large
            test_scope: KaidoRoutesAppTests
          - label: compact-large
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
          - label: compact-ax5
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: accessibility-extra-extra-extra-large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build for testing and boot the simulator alongside it
        id: simulator
        env:
          DEVICE_TYPE: ${{ matrix.device_type }}
          RUNTIME_PREFIX: ${{ matrix.runtime_prefix }}
          CONTENT_SIZE: ${{ matrix.content_size }}
        run: >-
          python3 scripts/build_and_boot_for_ci.py
          --test-plan Full
          --device-type "$DEVICE_TYPE"
          --runtime-prefix "$RUNTIME_PREFIX"
          --content-size "$CONTENT_SIZE"
          --derived-data "$RUNNER_TEMP/DerivedData"
          --build-log "$RUNNER_TEMP/KaidoRoutesApp-build.log"

      - name: App qualification
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TEST_SCOPE: ${{ matrix.test_scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test_selection=("-only-testing:$TEST_SCOPE")
          if [[ -n "$SHARD" ]]; then
            xcodebuild test-without-building \
              -project KaidoRoutesApp.xcodeproj \
              -scheme KaidoRoutesApp \
              -testPlan Full \
              -destination "id=$DEVICE_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -only-testing:"$TEST_SCOPE" \
              -enumerate-tests \
              -test-enumeration-style flat \
              -test-enumeration-format json \
              -test-enumeration-output-path "$RUNNER_TEMP/enabled-tests.json" \
              CODE_SIGNING_ALLOWED=NO
            python3 scripts/app_test_shard.py \
              "$RUNNER_TEMP/enabled-tests.json" "$TEST_SCOPE" "$SHARD" \
              > "$RUNNER_TEMP/shard-selection.txt"
            test_selection=()
            while IFS= read -r argument; do
              test_selection+=("$argument")
            done < "$RUNNER_TEMP/shard-selection.txt"
            echo "Shard $SHARD runs ${#test_selection[@]} tests"
          fi
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Full \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            "${test_selection[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-xcodebuild.log"

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            kaido-qualification-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-build.log
            ${{ runner.temp }}/KaidoRoutesApp-xcodebuild.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Validated unsigned iPhone archive
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Archive the unsigned iPhone Release product
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KaidoRoutes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutes-archive.log"

      - name: Validate the distributed iPhone archive
        run: |
          set -euo pipefail
          python3 scripts/validate_ios_release_bundle.py \
            "$RUNNER_TEMP/KaidoRoutes.xcarchive" 2>&1 \
            | tee "$RUNNER_TEMP/KaidoRoutes-bundle-validation.log"

      - name: Upload the validated unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: kaido-routes-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/KaidoRoutes.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-release-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutes-archive.log
            ${{ runner.temp }}/KaidoRoutes-bundle-validation.log
          if-no-files-found: warn
          retention-days: 7
