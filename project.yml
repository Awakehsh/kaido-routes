name: KaidoRoutesApp

options:
  bundleIdPrefix: app.kaidoroutes
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: "1.0.0"

packages:
  KaidoRoutesCore:
    path: .

targets:
  KaidoRoutesApp:
    type: application
    platform: iOS
    productName: KaidoRoutes
    sources:
      - path: Apps/KaidoRoutesApp/Sources
      - path: Apps/KaidoRoutesApp/Resources
      - path: LICENSE
        buildPhase: resources
        group: Distribution
      - path: DATA-LICENSES.md
        buildPhase: resources
        group: Distribution
      - path: data/route-atlas/design/shuto-route-atlas-recognition-reference.svg
        buildPhase: resources
        group: Route Atlas
      - path: data/route-atlas/design/k7-northwest-up-schematic-layout-candidate.svg
        buildPhase: resources
        group: Route Atlas
      - path: data/route-atlas/attribution/route-atlas-attribution-catalog.json
        buildPhase: resources
        group: Route Atlas
      - path: data/route-atlas/osm-derived/k7-northwest-260721-directed-database.json
        buildPhase: resources
        group: Internal Calibration
      - path: data/route-atlas/osm-derived/c2-b-20260729-geographic-route.json
        buildPhase: resources
        group: Route Atlas
      - path: data/route-atlas/osm-derived/shuto-whole-network-20260804.json
        buildPhase: resources
        group: Route Atlas
      - path: data/route-atlas/candidates/k7-northwest-up-aoba-to-kohoku-osm-directed-candidate.json
        buildPhase: resources
        group: Internal Calibration
      - path: data/product/pre-drive-evidence/k7-aoba-to-kohoku-pre-drive-evidence.json
        buildPhase: resources
        group: Product Release
    dependencies:
      - package: KaidoRoutesCore
        product: KaidoDomain
      - package: KaidoRoutesCore
        product: KaidoRouting
      - package: KaidoRoutesCore
        product: KaidoNavigation
      - package: KaidoRoutesCore
        product: KaidoPresentation
      - package: KaidoRoutesCore
        product: KaidoAppleAdapters
    configFiles:
      Debug: Apps/KaidoRoutesApp/Config/Signing.xcconfig
      Release: Apps/KaidoRoutesApp/Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: KaidoRoutes
        PRODUCT_MODULE_NAME: KaidoRoutesApp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Kaido Routes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Kaido Routes uses your location after you choose Current Location or start route navigation.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: false
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.kaidoroutes.preview
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.kaidoroutes
          CODE_SIGN_IDENTITY: Apple Distribution
          EXCLUDED_SOURCE_FILE_NAMES: >-
            c2-b-20260729-geographic-route.json
            k7-aoba-kohoku-product-release.json
            k7-aoba-to-kohoku-pre-drive-evidence.json
            k7-northwest-260721-directed-database.json
            k7-northwest-up-aoba-to-kohoku-osm-directed-candidate.json
            k7-northwest-up-schematic-layout-candidate.svg
            route-atlas-attribution-catalog.json
            shuto-route-atlas-recognition-reference.svg
            synthetic-product-runtime-preview.json

  KaidoRoutesAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/KaidoRoutesApp/Tests
    dependencies:
      - target: KaidoRoutesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kaidoroutes.preview.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KaidoRoutes.app/KaidoRoutes"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: false

  KaidoRoutesAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/KaidoRoutesApp/UITests
    dependencies:
      - target: KaidoRoutesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kaidoroutes.preview.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: KaidoRoutesApp
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: false

schemes:
  KaidoRoutesApp:
    build:
      targets:
        KaidoRoutesApp: all
        KaidoRoutesAppTests:
          - test
        KaidoRoutesAppUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KaidoRoutesAppTests
        - KaidoRoutesAppUITests
    archive:
      config: Release

  KaidoRoutesReleaseSmoke:
    build:
      targets:
        KaidoRoutesApp: all
        KaidoRoutesAppUITests:
          - test
    test:
      config: Release
      targets:
        - KaidoRoutesAppUITests
    run:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
