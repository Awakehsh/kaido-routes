name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished pull-request run. Every main commit
# gets its own group so none is cancelled or replaced while queued.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      verification-required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            || -z "$BASE_SHA" \
            || "$BASE_SHA" =~ ^0+$ ]]; then
            required=true
          else
            while IFS= read -r path; do
              case "$path" in
                README.md|AGENTS.md|CLAUDE.md|PRIVACY.md|CONTRIBUTING.md|SECURITY.md \
                  |.github/pull_request_template.md|.github/CODEOWNERS \
                  |docs/*|research/*|data/route-atlas/design/*.html)
                  ;;
                *)
                  required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  deterministic:
    name: Deterministic product verification
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Swift tests and portable scenarios
        run: |
          set -euo pipefail
          swift test
          swift run kaido-scenarios e2e/scenarios

      - name: Scenario and data contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_e2e.py
          python3 scripts/verify_facility_candidate_review.py
          python3 scripts/audit_shuto_network.py
          python3 -m unittest discover -s scripts/tests

      - name: Retained joint product release
        run: >-
          swift run kaido-release validate-product
          --artifact
          data/product/releases/k7-northwest-up-aoba-to-kohoku-product-release.json

  # Unit tests and UI journeys run as parallel jobs, each building for itself.
  # Handing one build to both would put a build job, a second runner
  # allocation and the simulator boot in series; building in each job lets
  # the boot overlap the compile.
  app:
    name: iPhone app ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit tests
            slug: unit
            test-target: KaidoRoutesAppTests
          - suite: UI journeys
            slug: ui
            test-target: KaidoRoutesAppUITests
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Every App test belongs to a test plan
        if: matrix.slug == 'unit'
        run: python3 scripts/check_app_test_plans.py

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build for testing and boot the simulator alongside it
        id: simulator
        run: >-
          python3 scripts/build_and_boot_for_ci.py
          --test-plan Verify
          --device-type com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          --content-size large
          --derived-data "$RUNNER_TEMP/DerivedData"
          --build-log "$RUNNER_TEMP/KaidoRoutesApp-build.log"

      - name: Verify test plan (${{ matrix.suite }})
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TEST_TARGET: ${{ matrix.test-target }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Verify \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:"$TEST_TARGET" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-test.log"

      - name: Upload App test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-app-${{ matrix.slug }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-build.log
            ${{ runner.temp }}/KaidoRoutesApp-test.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: Verification gate
    needs: [changes, deterministic, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject a run whose verification did not pass
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: |
          echo 'Upstream verification did not pass:'
          echo '${{ toJSON(needs) }}'
          exit 1
