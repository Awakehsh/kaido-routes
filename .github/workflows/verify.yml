name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic product verification
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Swift tests and portable scenarios
        run: |
          set -euo pipefail
          swift test
          swift run kaido-scenarios e2e/scenarios

      - name: Scenario and data contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_e2e.py
          python3 scripts/verify_facility_candidate_review.py
          python3 -m unittest discover -s scripts/tests

      - name: Retained joint product release
        run: >-
          swift run kaido-release validate-product
          --artifact
          data/product/releases/k7-northwest-up-aoba-to-kohoku-product-release.json

  app:
    name: iPhone app unit and journey smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Boot the primary simulator
        id: simulator
        env:
          TARGET_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
        run: |
          set -euo pipefail
          SELECTION=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime in devices
              for device in devices[runtime]
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier")
                  == os.environ["TARGET_DEVICE_TYPE"]
          ]
          if not candidates:
              raise SystemExit(
                  "target iPhone simulator is unavailable: "
                  + os.environ["TARGET_DEVICE_TYPE"]
              )
          def runtime_version(identifier):
              tail = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(component) for component in tail.split("-"))
          runtime, device = max(
              candidates,
              key=lambda candidate: runtime_version(candidate[0]),
          )
          print("\t".join((device["udid"], device["name"], runtime)))
          ')
          IFS=$'\t' read -r DEVICE_ID DEVICE_NAME RUNTIME_ID <<< "$SELECTION"
          echo "Selected $DEVICE_NAME on $RUNTIME_ID"
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID"
          xcrun simctl location "$DEVICE_ID" set 35.6586,139.7454
          xcrun simctl ui "$DEVICE_ID" content_size large

      - name: App unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -destination "id=${{ steps.simulator.outputs.device-id }}" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp-unit.xcresult" \
            -only-testing:KaidoRoutesAppTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-unit.log"

      - name: Critical route journey UI smoke
        run: |
          set -euo pipefail
          xcodebuild test \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -destination "id=${{ steps.simulator.outputs.device-id }}" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp-smoke.xcresult" \
            -only-testing:KaidoRoutesAppUITests/KaidoProductJourneyUITests/testExactCustomRouteWithReviewedGuidanceStartsLiveNavigation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-smoke.log"

      - name: Upload App test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-app-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-unit.log
            ${{ runner.temp }}/KaidoRoutesApp-unit.xcresult
            ${{ runner.temp }}/KaidoRoutesApp-smoke.log
            ${{ runner.temp }}/KaidoRoutesApp-smoke.xcresult
          if-no-files-found: warn
          retention-days: 7
