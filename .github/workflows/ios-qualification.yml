name: iOS qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

# The nightly run waits behind a manual qualification instead of cancelling it.
concurrency:
  group: ios-qualification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  simulator:
    name: Simulator qualification (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Full plan on the primary simulator runs as three parallel
          # legs: the unit tests, and the UI tests dealt by name into two
          # shards so a new UI test lands in one without being listed.
          - label: primary-unit
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppTests
          - label: primary-ui-1
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppUITests
            shard: 1/2
          - label: primary-ui-2
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: KaidoRoutesAppUITests
            shard: 2/2
          - label: ios18-unit
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
            runtime_prefix: com.apple.CoreSimulator.SimRuntime.iOS-18-
            content_size: large
            test_scope: KaidoRoutesAppTests
          - label: compact-large
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
          - label: compact-ax5
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: accessibility-extra-extra-extra-large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Select the qualification simulator
        id: simulator
        env:
          TARGET_DEVICE_TYPE: ${{ matrix.device_type }}
          TARGET_RUNTIME_PREFIX: ${{ matrix.runtime_prefix }}
        run: |
          set -euo pipefail
          SELECTION=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime in devices
              for device in devices[runtime]
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier")
                  == os.environ["TARGET_DEVICE_TYPE"]
              and runtime.startswith(os.environ["TARGET_RUNTIME_PREFIX"])
          ]
          if not candidates:
              raise SystemExit(
                  "target iPhone simulator is unavailable: "
                  + os.environ["TARGET_DEVICE_TYPE"]
                  + " " + os.environ["TARGET_RUNTIME_PREFIX"]
              )
          def runtime_version(identifier):
              tail = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(component) for component in tail.split("-"))
          runtime, device = max(
              candidates,
              key=lambda candidate: runtime_version(candidate[0]),
          )
          print("\t".join((device["udid"], device["name"], runtime)))
          ')
          IFS=$'\t' read -r DEVICE_ID DEVICE_NAME RUNTIME_ID <<< "$SELECTION"
          echo "Selected $DEVICE_NAME on $RUNTIME_ID"
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build for testing while the simulator boots
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TARGET_CONTENT_SIZE: ${{ matrix.content_size }}
        run: |
          set -euo pipefail
          # The build targets a generic simulator, so it never waits on the
          # booting device; tests run on that device in the next step.
          (
            set -euo pipefail
            echo "Simulator boot started"
            xcrun simctl boot "$DEVICE_ID"
            xcrun simctl bootstatus "$DEVICE_ID" > /dev/null
            xcrun simctl location "$DEVICE_ID" set 35.6586,139.7454
            xcrun simctl ui "$DEVICE_ID" content_size "$TARGET_CONTENT_SIZE"
            echo "Simulator ready"
          ) &
          SIMULATOR_PID=$!
          xcodebuild build-for-testing \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Full \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-build.log"
          echo "Build finished"
          wait "$SIMULATOR_PID"

      - name: App qualification
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TEST_SCOPE: ${{ matrix.test_scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test_selection=("-only-testing:$TEST_SCOPE")
          if [[ -n "$SHARD" ]]; then
            xcodebuild test-without-building \
              -project KaidoRoutesApp.xcodeproj \
              -scheme KaidoRoutesApp \
              -testPlan Full \
              -destination "id=$DEVICE_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -only-testing:"$TEST_SCOPE" \
              -enumerate-tests \
              -test-enumeration-style flat \
              -test-enumeration-format json \
              -test-enumeration-output-path "$RUNNER_TEMP/enabled-tests.json" \
              CODE_SIGNING_ALLOWED=NO
            python3 scripts/app_test_shard.py \
              "$RUNNER_TEMP/enabled-tests.json" "$SHARD" \
              > "$RUNNER_TEMP/shard-selection.txt"
            test_selection=()
            while IFS= read -r argument; do
              test_selection+=("$argument")
            done < "$RUNNER_TEMP/shard-selection.txt"
            echo "Shard $SHARD runs ${#test_selection[@]} tests"
          fi
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Full \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            "${test_selection[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-xcodebuild.log"

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            kaido-qualification-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-build.log
            ${{ runner.temp }}/KaidoRoutesApp-xcodebuild.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Validated unsigned iPhone archive
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Archive the unsigned iPhone Release product
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KaidoRoutes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutes-archive.log"

      - name: Validate the distributed iPhone archive
        run: |
          set -euo pipefail
          python3 scripts/validate_ios_release_bundle.py \
            "$RUNNER_TEMP/KaidoRoutes.xcarchive" 2>&1 \
            | tee "$RUNNER_TEMP/KaidoRoutes-bundle-validation.log"

      - name: Upload the validated unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: kaido-routes-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/KaidoRoutes.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-release-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutes-archive.log
            ${{ runner.temp }}/KaidoRoutes-bundle-validation.log
          if-no-files-found: warn
          retention-days: 7
