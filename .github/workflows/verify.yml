name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished pull-request run. Every main commit
# gets its own group so none is cancelled or replaced while queued.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      verification-required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            || -z "$BASE_SHA" \
            || "$BASE_SHA" =~ ^0+$ ]]; then
            required=true
          else
            while IFS= read -r path; do
              case "$path" in
                README.md|AGENTS.md|CLAUDE.md|PRIVACY.md|CONTRIBUTING.md|SECURITY.md \
                  |.github/pull_request_template.md|.github/CODEOWNERS \
                  |docs/*|research/*|data/route-atlas/design/*.html)
                  ;;
                *)
                  required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  deterministic:
    name: Deterministic product verification
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      # Optimized code runs the suite in about a seventh of the debug CPU
      # time, and the package has no assert() or #if DEBUG that -O would
      # change. Every swift command reuses the one release build: swift run
      # after swift test would build again without testing enabled.
      - name: Swift tests and portable scenarios
        run: |
          set -euo pipefail
          swift build -c release --build-tests
          swift test -c release --skip-build
          swift run -c release --skip-build kaido-scenarios e2e/scenarios

      - name: Scenario and data contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_e2e.py
          python3 scripts/verify_facility_candidate_review.py
          python3 scripts/audit_shuto_network.py
          python3 -m unittest discover -s scripts/tests

      - name: Retained joint product release
        run: >-
          swift run -c release --skip-build kaido-release validate-product
          --artifact
          data/product/releases/k7-northwest-up-aoba-to-kohoku-product-release.json

  # Unit tests, in two shards of about equal measured duration, and UI
  # journeys run as parallel jobs, each building for itself. Handing one
  # build to all would put a build job and a second runner allocation in
  # series before any test could start.
  app:
    name: iPhone app ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit tests (1/2)
            slug: unit-1
            test-target: KaidoRoutesAppTests
            shard: 1/2
          - suite: unit tests (2/2)
            slug: unit-2
            test-target: KaidoRoutesAppTests
            shard: 2/2
          - suite: UI journeys
            slug: ui
            test-target: KaidoRoutesAppUITests
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Every App test belongs to a test plan
        if: matrix.slug == 'unit-1'
        run: python3 scripts/check_app_test_plans.py

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build for testing and boot the simulator alongside it
        id: simulator
        run: >-
          python3 scripts/build_and_boot_for_ci.py
          --test-plan Verify
          --device-type com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          --content-size large
          --derived-data "$RUNNER_TEMP/DerivedData"
          --build-log "$RUNNER_TEMP/KaidoRoutesApp-build.log"

      - name: Verify test plan (${{ matrix.suite }})
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TEST_TARGET: ${{ matrix.test-target }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test_selection=("-only-testing:$TEST_TARGET")
          if [[ -n "$SHARD" ]]; then
            python3 scripts/app_test_balance.py select \
              Apps/KaidoRoutesApp/TestPlans/verify-unit-test-durations.json \
              "$TEST_TARGET" "$SHARD" > "$RUNNER_TEMP/shard-selection.txt"
            test_selection=()
            while IFS= read -r argument; do
              test_selection+=("$argument")
            done < "$RUNNER_TEMP/shard-selection.txt"
          fi
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Verify \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "${test_selection[@]}" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-test.log"

      - name: Upload App test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-app-${{ matrix.slug }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-build.log
            ${{ runner.temp }}/KaidoRoutesApp-test.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  # The simulator gives the main thread 8 MB of stack; an iPhone gives it
  # 1008 KB. Release SwiftUI reserves stack for every inline view value, so a
  # Release build can overflow on the phone while every simulator test
  # passes. This job links the Release app with the iPhone's stack size, drives
  # it from the home to the end of a live drive, and fails on a crash or when
  # the main thread's stack high-water mark passes 640 KB, which keeps
  # headroom below the phone's limit. Stack use depends on the SwiftUI
  # runtime: on macos-15 (Xcode 26.3, iOS 26.2) the build that crashed the
  # phone still fit, on macos-26 (Xcode 26.6, iOS 26.5) it does not.
  release-stack:
    name: iPhone Release stack
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      STACK_SIZE: "0xfc000"
      HIGH_WATER_LIMIT_KB: "640"
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build Release for testing, then relink the app with the iPhone's stack
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/KaidoRoutesApp-release-build.log"
          xcodebuild build-for-testing \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesReleaseSmoke \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1 || { tail -50 "$log"; exit 1; }
          xcodebuild build \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            "OTHER_LDFLAGS=\$(inherited) -Wl,-stack_size,$STACK_SIZE" \
            >> "$log" 2>&1 || { tail -50 "$log"; exit 1; }
          binary="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/KaidoRoutes.app/KaidoRoutes"
          linked=$(otool -l "$binary" | awk '/stacksize/ {print $2; exit}')
          echo "Main-thread stack linked: $linked bytes"
          test "$linked" -eq $((STACK_SIZE))

      # Booted only after the build: a starting xcodebuild waits on a booting
      # simulator (see scripts/build_and_boot_for_ci.py).
      - name: Drive the Release journey and read the main-thread stack
        run: |
          set -euo pipefail
          udid=$(xcrun simctl create release-stack com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" >/dev/null
          xcrun simctl location "$udid" set 35.6586,139.7454
          log="$RUNNER_TEMP/KaidoRoutesApp-release-stack-test.log"
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesReleaseSmoke \
            -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:KaidoRoutesAppUITests/ReleaseStackJourneyUITests \
            -resultBundlePath "$RUNNER_TEMP/ReleaseStack.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1 &
          test_pid=$!
          # vmmap suspends the app while it reads, so the stack is read once,
          # while the test holds its last screen. vmmap's thread-0 Stack row is
          # [ VSIZE RSDNT DIRTY SWAP ]; resident plus swapped pages is how much
          # of the stack has ever been touched.
          peak=""
          while kill -0 "$test_pid" 2>/dev/null; do
            if grep -q "Hold the last screen for the stack reading" "$log"; then
              app=$(pgrep -f "Devices/$udid/.*/KaidoRoutes\.app/KaidoRoutes$" | head -1 || true)
              for attempt in 1 2 3; do
                [[ -n "$app" ]] || break
                read_start=$(date +%s)
                peak=$(vmmap "$app" 2>> "$RUNNER_TEMP/vmmap-errors.txt" | awk '/^Stack .*thread 0$/ {
                  for (i = 1; i <= NF; i++) if ($i == "[") {
                    r = $(i + 2); s = $(i + 4); sub(/K/, "", r); sub(/K]?/, "", s)
                    print r + s
                  }
                }' || true)
                echo "Stack reading $attempt took $(( $(date +%s) - read_start )) s: ${peak:-no value}"
                [[ -n "$peak" ]] && break
              done
              break
            fi
            sleep 1
          done
          status=0
          wait "$test_pid" || status=$?
          grep -E "Test Case|error:" "$log" || true
          echo "Main-thread stack high-water: ${peak:-not read} KB (limit $HIGH_WATER_LIMIT_KB KB)"
          # A retap is the journey's fallback for a synthesized tap that did
          # nothing; list every one so a rising rate is visible.
          retaps=$(grep -c "RELEASE-JOURNEY-RETAP step=" "$log" || true)
          {
            echo "### iPhone Release stack"
            echo "- Main-thread stack high-water: ${peak:-not read} KB (limit $HIGH_WATER_LIMIT_KB KB)"
            echo "- Retaps: ${retaps:-0}"
            grep "RELEASE-JOURNEY-RETAP step=" "$log" | sed 's/.*RELEASE-JOURNEY-RETAP /  - /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${retaps:-0} > 0 )); then
            echo "::warning::The Release journey retapped ${retaps} time(s); see the job summary"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The Release journey failed on a $STACK_SIZE-byte main-thread stack"
            exit 1
          fi
          if [[ -z "$peak" ]]; then
            echo "::error::The main-thread stack was not read at the end of the journey"
            exit 1
          fi
          if (( peak > HIGH_WATER_LIMIT_KB )); then
            echo "::error::Main-thread stack high-water ${peak} KB exceeds ${HIGH_WATER_LIMIT_KB} KB"
            exit 1
          fi

      - name: Upload Release stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-release-stack-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-release-build.log
            ${{ runner.temp }}/KaidoRoutesApp-release-stack-test.log
            ${{ runner.temp }}/ReleaseStack.xcresult
            ${{ runner.temp }}/vmmap-errors.txt
            ~/Library/Logs/DiagnosticReports/KaidoRoutes-*.ips
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: Verification gate
    needs: [changes, deterministic, app, release-stack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject a run whose verification did not pass
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: |
          echo 'Upstream verification did not pass:'
          echo '${{ toJSON(needs) }}'
          exit 1
