name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Deterministic core and scenarios
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner's default command-line toolchain lags the package's
      # required Swift tools version, so pin the newest installed Xcode
      # rather than whichever one the image defaults to.
      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Record toolchain
        run: xcodebuild -version

      - name: Swift Testing suite
        run: swift test

      - name: Portable scenario assertions
        run: swift run kaido-scenarios e2e/scenarios

      - name: Scenario envelope contract
        run: python3 scripts/validate_e2e.py

  app:
    name: iPhone app tests (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: primary
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            content_size: large
            test_scope: ""
          - label: compact-large
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
          - label: compact-ax5
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            content_size: accessibility-extra-extra-extra-large
            test_scope: KaidoRoutesAppUITests/KRU09AccessibilityUITests
    steps:
      - uses: actions/checkout@v7

      # The runner's default command-line toolchain lags the package's
      # required Swift tools version, so pin the newest installed Xcode
      # rather than whichever one the image defaults to.
      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the app project
        run: xcodegen generate

      # The product opens on the driver's surroundings, and several UI tests
      # derive an entrance from the current position. Select the exact device
      # role on the newest installed runtime instead of relying on simctl JSON
      # ordering. Tokyo Tower keeps derived pairings inside the C1 test area.
      - name: Boot a simulator with an injected position
        id: simulator
        env:
          TARGET_CONTENT_SIZE: ${{ matrix.content_size }}
          TARGET_DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          set -euo pipefail
          SELECTION=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime in devices
              for device in devices[runtime]
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier")
                  == os.environ["TARGET_DEVICE_TYPE"]
          ]
          if not candidates:
              raise SystemExit(
                  "target iPhone simulator is unavailable: "
                  + os.environ["TARGET_DEVICE_TYPE"]
              )
          def runtime_version(identifier):
              tail = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(component) for component in tail.split("-"))
          runtime, device = max(
              candidates,
              key=lambda candidate: runtime_version(candidate[0]),
          )
          print("\t".join((device["udid"], device["name"], runtime)))
          ')
          IFS=$'\t' read -r DEVICE_ID DEVICE_NAME RUNTIME_ID <<< "$SELECTION"
          echo "Selected $DEVICE_NAME on $RUNTIME_ID"
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID"
          xcrun simctl location "$DEVICE_ID" set 35.6586,139.7454
          xcrun simctl ui "$DEVICE_ID" content_size "$TARGET_CONTENT_SIZE"
          echo "Content size: $(xcrun simctl ui "$DEVICE_ID" content_size)"

      - name: App unit and UI tests
        env:
          TEST_SCOPE: ${{ matrix.test_scope }}
        run: |
          set -euo pipefail
          run_app_tests() {
            xcodebuild test \
              -project KaidoRoutesApp.xcodeproj \
              -scheme KaidoRoutesApp \
              -destination "id=${{ steps.simulator.outputs.device-id }}" \
              -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
              "$@" \
              CODE_SIGNING_ALLOWED=NO
          }
          if [[ -n "$TEST_SCOPE" ]]; then
            run_app_tests "-only-testing:$TEST_SCOPE" \
              | tee "$RUNNER_TEMP/KaidoRoutesApp-xcodebuild.log" \
              | xcpretty
          else
            run_app_tests \
              | tee "$RUNNER_TEMP/KaidoRoutesApp-xcodebuild.log" \
              | xcpretty
          fi

      - name: Upload App test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            kaido-app-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-xcodebuild.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Unsigned iPhone Release bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the app project
        run: xcodegen generate

      - name: Boot the Release smoke simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime in devices
              for device in devices[runtime]
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier")
                  == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"
          ]
          if not candidates:
              raise SystemExit("iPhone 17 Pro simulator is unavailable")
          def version(identifier):
              return tuple(
                  int(component)
                  for component in identifier.rsplit(".iOS-", 1)[-1].split("-")
              )
          print(max(candidates, key=lambda item: version(item[0]))[1]["udid"])
          ')
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID"

      - name: Exercise the unsigned Release product
        run: |
          set -euo pipefail
          xcodebuild test \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesReleaseSmoke \
            -destination 'id=${{ steps.simulator.outputs.device-id }}' \
            -derivedDataPath "$RUNNER_TEMP/KaidoRoutesRelease" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesRelease.xcresult" \
            -only-testing:KaidoRoutesAppUITests/KaidoProductJourneyUITests/testWholeShutoInformationExposesPrivacyPolicyAndBuildVersion \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive the unsigned iPhone Release product
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KaidoRoutes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutes-archive.log"

      - name: Validate the distributed iPhone archive
        run: |
          set -euo pipefail
          python3 scripts/validate_ios_release_bundle.py \
            "$RUNNER_TEMP/KaidoRoutes.xcarchive" 2>&1 \
            | tee "$RUNNER_TEMP/KaidoRoutes-bundle-validation.log"

      - name: Upload Release smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-release-smoke-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesRelease.xcresult
            ${{ runner.temp }}/KaidoRoutes-archive.log
            ${{ runner.temp }}/KaidoRoutes-bundle-validation.log
            ${{ runner.temp }}/KaidoRoutes.xcarchive
          if-no-files-found: warn
          retention-days: 7

  data:
    name: Snapshot and evidence integrity
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runner's default command-line toolchain lags the package's
      # required Swift tools version, so pin the newest installed Xcode
      # rather than whichever one the image defaults to.
      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      # The reviewed candidate exclusions must keep matching the committed
      # snapshot: a stale review is a build failure, not a silent no-op.
      - name: Facility candidate review still applies
        run: python3 scripts/verify_facility_candidate_review.py

      - name: Validator regression suite
        run: python3 -m unittest discover -s scripts/tests

      # The retained K7 product is a deterministic regression anchor, not the
      # default delivery route. Running the production validator here proves
      # that navigation and atlas inputs still pass the joint release gate.
      - name: Joint product release validation
        run: >-
          swift run kaido-release validate-product
          --artifact
          data/product/releases/k7-northwest-up-aoba-to-kohoku-product-release.json
