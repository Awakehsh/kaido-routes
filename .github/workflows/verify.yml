name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished pull-request run. Every main commit
# gets its own group so none is cancelled or replaced while queued.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      verification-required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            || -z "$BASE_SHA" \
            || "$BASE_SHA" =~ ^0+$ ]]; then
            required=true
          else
            while IFS= read -r path; do
              case "$path" in
                README.md|AGENTS.md|CLAUDE.md|PRIVACY.md|CONTRIBUTING.md|SECURITY.md \
                  |.github/pull_request_template.md|.github/CODEOWNERS \
                  |docs/*|research/*|data/route-atlas/design/*.html)
                  ;;
                *)
                  required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  deterministic:
    name: Deterministic product verification
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Swift tests and portable scenarios
        run: |
          set -euo pipefail
          swift test
          swift run kaido-scenarios e2e/scenarios

      - name: Scenario and data contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_e2e.py
          python3 scripts/verify_facility_candidate_review.py
          python3 scripts/audit_shuto_network.py
          python3 -m unittest discover -s scripts/tests

      - name: Retained joint product release
        run: >-
          swift run kaido-release validate-product
          --artifact
          data/product/releases/k7-northwest-up-aoba-to-kohoku-product-release.json

  # Unit tests and UI journeys run as parallel jobs. Each builds for itself:
  # handing the build products to the other job would cost an upload and a
  # download on the critical path, while a second build costs only runner
  # time.
  app:
    name: iPhone app ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.verification-required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit tests
            slug: unit
            test-target: KaidoRoutesAppTests
          - suite: UI journeys
            slug: ui
            test-target: KaidoRoutesAppUITests
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode toolchain
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Every App test belongs to a test plan
        if: matrix.slug == 'unit'
        run: python3 scripts/check_app_test_plans.py

      - name: Generate the app project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Select the primary simulator
        id: simulator
        env:
          TARGET_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
        run: |
          set -euo pipefail
          SELECTION=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime in devices
              for device in devices[runtime]
              if device.get("isAvailable")
              and device.get("deviceTypeIdentifier")
                  == os.environ["TARGET_DEVICE_TYPE"]
          ]
          if not candidates:
              raise SystemExit(
                  "target iPhone simulator is unavailable: "
                  + os.environ["TARGET_DEVICE_TYPE"]
              )
          def runtime_version(identifier):
              tail = identifier.rsplit(".iOS-", 1)[-1]
              return tuple(int(component) for component in tail.split("-"))
          runtime, device = max(
              candidates,
              key=lambda candidate: runtime_version(candidate[0]),
          )
          print("\t".join(
              (device["udid"], device["name"], runtime, device["state"])
          ))
          ')
          IFS=$'\t' read -r DEVICE_ID DEVICE_NAME RUNTIME_ID DEVICE_STATE \
            <<< "$SELECTION"
          echo "Selected $DEVICE_NAME on $RUNTIME_ID ($DEVICE_STATE)"
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "device-state=$DEVICE_STATE" >> "$GITHUB_OUTPUT"

      - name: Build for testing while the simulator boots
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          DEVICE_STATE: ${{ steps.simulator.outputs.device-state }}
        run: |
          set -euo pipefail
          # The build targets a generic simulator, so it never waits on the
          # booting device; tests run on that device in the next step.
          (
            set -euo pipefail
            echo "Simulator boot started"
            if [[ "$DEVICE_STATE" != "Booted" ]]; then
              xcrun simctl boot "$DEVICE_ID"
            fi
            xcrun simctl bootstatus "$DEVICE_ID" > /dev/null
            xcrun simctl location "$DEVICE_ID" set 35.6586,139.7454
            xcrun simctl ui "$DEVICE_ID" content_size large
            echo "Simulator ready"
          ) &
          SIMULATOR_PID=$!
          xcodebuild build-for-testing \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Verify \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-build.log"
          echo "Build finished"
          wait "$SIMULATOR_PID"

      - name: Verify test plan (${{ matrix.suite }})
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          TEST_TARGET: ${{ matrix.test-target }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project KaidoRoutesApp.xcodeproj \
            -scheme KaidoRoutesApp \
            -testPlan Verify \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:"$TEST_TARGET" \
            -resultBundlePath "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/KaidoRoutesApp-test.log"

      # TEMPORARY (measurement for the CI split; removed before merge).
      - name: Phase timings
        if: always()
        run: |
          xcrun xcresulttool get log --path "$RUNNER_TEMP/KaidoRoutesApp.xcresult" \
            --type action --compact | python3 -c '
          import json, sys
          def walk(node, depth=0):
              if depth < 3:
                  print("  " * depth + node.get("title", "")[:80],
                        round(node.get("duration") or 0, 1))
              for child in node.get("subsections", [])[:12]:
                  walk(child, depth + 1)
          walk(json.load(sys.stdin))
          '

      # TEMPORARY (measurement): what handing build products between jobs costs.
      - name: Upload build products (measurement)
        if: matrix.slug == 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: products-measurement-${{ github.run_attempt }}
          path: ${{ runner.temp }}/DerivedData/Build/Products
          retention-days: 1

      - name: Upload App test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kaido-app-${{ matrix.slug }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KaidoRoutesApp-build.log
            ${{ runner.temp }}/KaidoRoutesApp-test.log
            ${{ runner.temp }}/KaidoRoutesApp.xcresult
          if-no-files-found: warn
          retention-days: 7

  # TEMPORARY (measurement): download cost of the build products.
  products-download-measurement:
    needs: app
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: products-measurement-${{ github.run_attempt }}
          path: products
      - run: du -sh products

  gate:
    name: Verification gate
    needs: [changes, deterministic, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject a run whose verification did not pass
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        run: |
          echo 'Upstream verification did not pass:'
          echo '${{ toJSON(needs) }}'
          exit 1
